services:
  netpilot-agent:
    image: netpilot/agent:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.agent
    volumes:
      - netpilot-data:/data
    environment:
      - ROUTER_HOST=${ROUTER_HOST:-}
      - ROUTER_PASSWORD=${ROUTER_PASSWORD:-}
      - NetPilot__Rules__ForceDryRun=${NETPILOT_RULES_FORCE_DRYRUN:-true}
      - NetPilot__Rules__Enabled=${NETPILOT_RULES_ENABLED:-true}
      - NetPilot__PollIntervalSeconds=${NETPILOT_POLL_INTERVAL_SECONDS:-180}
      - NetPilot__Notifications__VapidSubject=${NETPILOT_VAPID_SUBJECT:-mailto:netpilot@localhost}
      - NetPilot__LocalTraffic__Url=${NETPILOT_LANTRAFFIC_URL:-}
      - NetPilot__LocalTraffic__Token=${NETPILOT_LANTRAFFIC_TOKEN:-}
      - NetPilot__TimeZone=${NETPILOT_TIMEZONE:-Africa/Cairo}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  netpilot-web:
    image: netpilot/web:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    volumes:
      - netpilot-data:/data
    environment:
      - NetPilot__Rules__ForceDryRun=${NETPILOT_RULES_FORCE_DRYRUN:-true}
      - NetPilot__Rules__Enabled=${NETPILOT_RULES_ENABLED:-true}
      - NetPilot__PollIntervalSeconds=${NETPILOT_POLL_INTERVAL_SECONDS:-180}
      - NetPilot__Notifications__VapidSubject=${NETPILOT_VAPID_SUBJECT:-mailto:netpilot@localhost}
      - NetPilot__LocalTraffic__Url=${NETPILOT_LANTRAFFIC_URL:-}
      - NetPilot__LocalTraffic__Token=${NETPILOT_LANTRAFFIC_TOKEN:-}
      - NetPilot__TimeZone=${NETPILOT_TIMEZONE:-Africa/Cairo}
    ports:
      - "8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    restart: unless-stopped

volumes:
  netpilot-data: